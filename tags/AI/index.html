<script data-hid="theme-init">

  let preference = 'auto'

    const saved = localStorage.getItem('nash-web-color-scheme')

      preference = saved
    else if (saved !== null)
      localStorage.removeItem('nash-web-color-scheme')
  } catch {
    // Browser privacy settings can disable local storage.
  }
  const dark = preference === 'dark'
    || (preference === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
  document.documentElement.classList.toggle('dark', dark)
})()
</script>
